<script type="module">
// "The Obby Scam": a blocky 3D story short (1080x1920). render(t) draws the frame at t seconds.
import * as THREE from 'three';
const W = 1080, H = 1920;
const story = await (await fetch('story.json')).json();
let VO = {};
try { VO = await (await fetch('vo/vo.json')).json(); } catch (e) { }
await Promise.all(['IT', 'I7', 'I6'].map(f => document.fonts.load(`40px ${f}`)));

// ------------------------------------------------------------------ helpers
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));

const pulse = (t, t0, d) => Math.sin(Math.PI * prog(t, t0, t0 + d));
function rand(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// ------------------------------------------------------------------ timeline from story.json + voice lengths
const B = {}, LINES = []; let acc = 0;
for (const b of story.beats) {
  let t = acc + b.lead; const ls = [];
  b.lines.forEach(([who, text], i) => {
    const id = `${b.id}_${i}`, d = VO[id] ?? text.length * .065;
    ls.push({ who, text, a: t, d, b: t + d, id }); t += d + .25;
  });
  const end = Math.max(acc + b.min, t - .25 + .5);
  B[b.id] = { a: acc, b: end, L: ls }; LINES.push(...ls); acc = end;
}
const TOTAL = acc;
const wt = (line, word) => line.a + line.d * clamp(line.text.indexOf(word) / line.text.length);

// ------------------------------------------------------------------ the world
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 512; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#3D8BFF'); gr.addColorStop(.55, '#8FD3FF'); gr.addColorStop(1, '#FFE3B8');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
  const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; scene.background = tx;
}
scene.fog = new THREE.Fog(0xC9E8FF, 55, 150);
const cam = new THREE.PerspectiveCamera(50, W / H, .1, 400);
scene.add(new THREE.HemisphereLight(0xffffff, 0x9fb7d9, 1.9));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.6);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 90 });
sun.shadow.bias = -.0008; scene.add(sun, sun.target);

const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .55, ...o });
function box(w, h, d, mat, x = 0, y = 0, z = 0, shadow = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; return m;
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}

// platforms: top surface at y + .5
const PL = [
  { x: 0, y: 0, c: 0xFF4D6D }, { x: 8, y: 1.2, c: 0xFFBE0B }, { x: 16, y: .4, c: 0x3A86FF }, { x: 24, y: 2, c: 0x8338EC },
  { x: 32, y: 2, c: 0x06D6A0, w: 6 }, { x: 39.5, y: 2.6, c: 0xFB5607 }, { x: 49, y: 3.4, c: 0xFFD23F, w: 10, d: 7 },
];
const top = i => PL[i].y + .5;
PL.forEach(p => {
  const w = p.w || 5, d = p.d || 5;
  scene.add(box(w, 1, d, std(new THREE.Color(p.c).multiplyScalar(.75)), p.x, p.y - .06, 0));
  scene.add(box(w - .3, .14, d - .3, std(new THREE.Color(p.c).lerp(new THREE.Color(0xffffff), .25)), p.x, p.y + .5, 0));
});
// background platforms and floating blocks for depth
for (let i = 0; i < 26; i++) {
  const c = [0xFF4D6D, 0xFFBE0B, 0x3A86FF, 0x8338EC, 0x06D6A0, 0xFB5607][i % 6];
  const s = 1.5 + rand(i) * 3;
  scene.add(box(s, s * .4 + .5, s, std(c), -10 + i * 3.2 + rand(i + 9) * 3, -4 + rand(i + 3) * 14, -14 - rand(i + 5) * 28, false));
}
// lava sea with bubbles
const lava = new THREE.Mesh(new THREE.PlaneGeometry(600, 300), std(0xFF5A1F, { emissive: 0xFF3D00, emissiveIntensity: .9, roughness: .4 }));
lava.rotation.x = -Math.PI / 2; lava.position.set(30, -9, -60); scene.add(lava);
const bubbles = [...Array(18)].map((_, i) => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(.5 + rand(i) * .9, 12, 8), std(0xFFB020, { emissive: 0xFF6A00, emissiveIntensity: 1 }));
  m.position.set(-10 + i * 4.5 + rand(i + 2) * 3, -9, -6 - rand(i + 4) * 30); scene.add(m); return m;
});
// clouds
const clouds = [...Array(9)].map((_, i) => {
  const g = new THREE.Group(), m = std(0xffffff, { roughness: 1 });
  for (let k = 0; k < 4; k++) g.add(box(4 + rand(i * 7 + k) * 4, 2 + rand(i * 3 + k) * 1.5, 3, m, k * 2.6 - 4, rand(i + k) * 1.2, 0, false));
  g.position.set(-20 + i * 12, 16 + rand(i + 1) * 14, -70 - rand(i + 2) * 30); scene.add(g); return g;
});
// finish arch
{
  const p = PL[6], gold = std(0xFFD23F, { metalness: .3, roughness: .35 });
  scene.add(box(.8, 8, .8, std(0xffffff), p.x - 4.2, top(6) + 4, -2.6), box(.8, 8, .8, std(0xffffff), p.x + 4.2, top(6) + 4, -2.6));
  const ban = canvasTex(1024, 192, (g, w, h) => {
    for (let x = 0; x < w; x += 48) for (let y = 0; y < h; y += 48) { g.fillStyle = ((x + y) / 48) % 2 ? '#111' : '#fff'; g.fillRect(x, y, 48, 48); }
    g.fillStyle = '#FFD23F'; g.fillRect(150, 30, w - 300, h - 60);
    g.font = '130px IT'; g.fillStyle = '#1A1A2E'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('FINISH', w / 2, h / 2 + 8);
  });
  const mats = Array(6).fill(gold); mats[4] = std(0xffffff, { map: ban });
  const m = new THREE.Mesh(new THREE.BoxGeometry(9.4, 1.8, .6), mats); m.position.set(p.x, top(6) + 8.6, -2.6); m.castShadow = true; scene.add(m);
}
// trophy
const trophy = new THREE.Group();
{
  const gold = std(0xFFC21A, { metalness: .3, roughness: .25, emissive: 0x7A5200 });
  const cup = new THREE.Mesh(new THREE.CylinderGeometry(1.1, .45, 1.6, 24), gold); cup.position.y = 2.1;
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(.18, .18, .7, 12), gold); stem.position.y = .95;
  const base = box(1.4, .5, 1.4, gold, 0, .35, 0);
  const h1 = new THREE.Mesh(new THREE.TorusGeometry(.45, .11, 8, 20), gold); h1.position.set(1.1, 2.2, 0);
  const h2 = h1.clone(); h2.position.x = -1.1;
  [cup, stem, h1, h2].forEach(m => { m.castShadow = true; });
  trophy.add(cup, stem, base, h1, h2); trophy.position.set(PL[6].x + 2.6, top(6), -.5); scene.add(trophy);
}

// ------------------------------------------------------------------ characters
function face(skin, kind, blush) {

    g.fillStyle = skin; g.fillRect(0, 0, 256, 256);
    const ink = '#1A1A2E';
    const eye = (x, y, w, h) => { g.fillStyle = ink; g.beginPath(); g.ellipse(x, y, w, h, 0, 0, 7); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(x - w * .3, y - h * .35, w * .38, 0, 7); g.fill(); };
    const line = (pts, wdt = 12) => { g.strokeStyle = ink; g.lineWidth = wdt; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke(); };
    const openMouth = (y, r) => { g.fillStyle = '#3A1020'; g.beginPath(); g.moveTo(128 - r, y); g.lineTo(128 + r, y); g.arc(128, y, r, 0, Math.PI); g.fill(); g.fillStyle = '#FF7A90'; g.beginPath(); g.ellipse(128, y + r * .7, r * .5, r * .25, 0, 0, 7); g.fill(); };
    const star = (x, y, r) => { g.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.closePath(); g.fillStyle = '#FFD23F'; g.fill(); g.lineWidth = 6; g.strokeStyle = '#E09A00'; g.stroke(); };
    const shades = (y) => { g.fillStyle = '#0D0D14'; g.beginPath(); g.roundRect(40, y, 80, 46, 12); g.roundRect(136, y, 80, 46, 12); g.fill(); g.fillRect(110, y + 8, 36, 10); g.fillStyle = 'rgba(255,255,255,0.55)'; g.fillRect(56, y + 8, 22, 8); g.fillRect(152, y + 8, 22, 8); };
    if (blush) { g.fillStyle = 'rgba(255,110,140,0.45)'; g.beginPath(); g.ellipse(58, 160, 22, 13, 0, 0, 7); g.ellipse(198, 160, 22, 13, 0, 0, 7); g.fill(); }
    if (kind === 'happy') { eye(88, 108, 16, 24); eye(168, 108, 16, 24); line([[92, 158], [110, 176], [146, 176], [164, 158]]); }
    if (kind === 'grin') { line([[68, 116], [88, 96], [108, 116]], 13); line([[148, 116], [168, 96], [188, 116]], 13); openMouth(150, 50); }
    if (kind === 'shock') { line([[66, 66], [104, 58]], 10); line([[152, 58], [190, 66]], 10); eye(88, 110, 20, 30); eye(168, 110, 20, 30); g.fillStyle = '#3A1020'; g.beginPath(); g.ellipse(128, 182, 20, 26, 0, 0, 7); g.fill(); }
    if (kind === 'starry') { star(88, 108, 34); star(168, 108, 34); openMouth(152, 46); }
    if (kind === 'determined') { line([[64, 76], [108, 90]], 11); line([[148, 90], [192, 76]], 11); eye(88, 114, 15, 20); eye(168, 114, 15, 20); line([[100, 172], [128, 178], [158, 168]]); }
    if (kind === 'sly') { shades(92); line([[96, 178], [140, 180], [172, 162]]); }
    if (kind === 'busted') { shades(124); line([[70, 84], [104, 96]], 9); line([[152, 96], [186, 84]], 9); g.fillStyle = '#3A1020'; g.beginPath(); g.ellipse(128, 202, 16, 18, 0, 0, 7); g.fill();
      g.fillStyle = '#5BC0FF'; g.beginPath(); g.moveTo(214, 40); g.quadraticCurveTo(236, 80, 214, 88); g.quadraticCurveTo(194, 80, 214, 40); g.fill(); }
  });
}
function makeChar(o) {

  const skin = std(o.skin), shirt = std(o.shirt), pants = std(o.pants);
  const limb = (mat, x, y, len) => { const p = new THREE.Group(); p.position.set(x, y, 0); p.add(box(.95, len, 1, mat, 0, -len / 2 + .05, 0)); g.add(p); return p; };
  const legL = limb(pants, -.5, 2, 2), legR = limb(pants, .5, 2, 2);
  const tm = Array(6).fill(shirt); if (o.chest) tm[4] = std(0xffffff, { map: o.chest });
  const torso = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), tm); torso.position.y = 3; torso.castShadow = true; g.add(torso);
  const armL = limb(o.sleeve ? shirt : skin, -1.48, 3.9, 2), armR = limb(o.sleeve ? shirt : skin, 1.48, 3.9, 2);
  const head = new THREE.Group(); head.position.y = 4; g.add(head);
  const faceMat = new THREE.MeshStandardMaterial({ roughness: .6 });
  const hm = [skin, skin, skin, skin, faceMat, skin];
  const hd = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 1.6), hm); hd.position.y = .85; hd.castShadow = true; head.add(hd);
  if (o.cap) { head.add(box(1.72, .42, 1.72, std(o.cap), 0, 1.78, 0)); head.add(box(1.4, .12, .9, std(o.cap), 0, 1.62, 1.1)); }
  if (o.hood) { head.add(box(1.84, 1.84, 1.3, std(o.hood), 0, .95, -.32)); head.add(box(1.84, .3, 1.84, std(o.hood), 0, 1.84, 0)); }
  const tex = Object.fromEntries(o.faces.map(k => [k, face(o.skin, k, o.blush)]));
  return { g, legL, legR, armL, armR, head, faceMat, tex };
}
function pose(c, s) {
  c.g.visible = (s.scale ?? 1) > .01;
  c.g.position.set(s.x, s.y, s.z || 0); c.g.rotation.set(0, s.ry || 0, s.rz || 0);
  const sq = s.sq || 0, sc = s.scale ?? 1; c.g.scale.set(sc * (1 + sq * .5), sc * (1 - sq), sc * (1 + sq * .5));
  c.armL.rotation.set(s.aL || 0, 0, s.zL || 0); c.armR.rotation.set(s.aR || 0, 0, s.zR || 0);
  c.legL.rotation.x = s.lL || 0; c.legR.rotation.x = s.lR || 0;
  c.head.rotation.set(s.hx || 0, s.hy || 0, s.hz || 0);
  const t = c.tex[s.expr]; if (c.faceMat.map !== t) { c.faceMat.map = t; c.faceMat.needsUpdate = true; }
}
const dollar = canvasTex(256, 256, (g) => { g.fillStyle = '#7B2CBF'; g.fillRect(0, 0, 256, 256); g.font = '170px IT'; g.fillStyle = '#FFD23F'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('$', 128, 138); });
const hero = makeChar({ skin: '#F5C99B', shirt: '#2EC4B6', pants: '#264E86', cap: '#EF233C', blush: true, faces: ['happy', 'grin', 'shock', 'starry', 'determined'] });
const bad = makeChar({ skin: '#D9A27A', shirt: '#7B2CBF', pants: '#2B2D42', hood: '#6A23A8', sleeve: true, chest: dollar, faces: ['sly', 'busted'] });

// coins and smoke
const coinMat = std(0xFFC21A, { metalness: .3, roughness: .3, emissive: 0x7A5200 });
const coins = [...Array(7)].map(() => { const m = new THREE.Mesh(new THREE.CylinderGeometry(.6, .6, .16, 28), coinMat.clone()); m.rotation.order = 'YXZ'; m.castShadow = true; scene.add(m); return m; });
const puffs = [...Array(16)].map(() => { const m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, roughness: 1 })); scene.add(m); return m; });

// ------------------------------------------------------------------ hero choreography
const EVENTS = []; const ev = (t, type, gain = 1, id) => EVENTS.push({ t: +t.toFixed(3), type, gain, id });
const JUMPS = [];
const jump = (t0, d, x0, y0, x1, y1, h = 3.2) => { JUMPS.push({ t0, t1: t0 + d, x0, y0, x1, y1, h }); ev(t0, 'boing'); ev(t0 + d, 'land'); };
const bI = B.intro.a, bW = B.wobble.a, bWin = B.win.a;
const HX4 = PL[4].x - 1.2;                     // where Max stands for the conversation
jump(bI + .35, .6, PL[0].x, top(0), PL[1].x, top(1));
jump(bI + 1.2, .6, PL[1].x, top(1), PL[2].x, top(2));
jump(bI + 2.05, .6, PL[2].x, top(2), PL[3].x, top(3));
jump(bW + .05, .6, PL[3].x, top(3), PL[4].x - 2.85, top(4), 3.6);
const WOB0 = bW + .65, WOB1 = WOB0 + 1.35, STEP1 = WOB1 + .45;
ev(WOB0 + .02, 'slide');
jump(bWin + .25, .6, HX4, top(4), PL[5].x, top(5));
jump(bWin + 1.05, .7, PL[5].x, top(5), PL[6].x - 2, top(6), 3.8);
const LAND = bWin + 1.75;
ev(LAND, 'fanfare'); ev(LAND + .05, 'confetti');

function heroGround(t) {   // x, y of the feet ignoring jump arcs; used for the camera
  let x = PL[0].x, y = top(0);
  for (const j of JUMPS) {
    if (t >= j.t1) { x = j.x1; y = j.y1; }
    else if (t > j.t0) { const k = eio(prog(t, j.t0, j.t1)); x = lerp(j.x0, j.x1, k); y = lerp(j.y0, j.y1, k); }
  }
  if (t > WOB1) x = lerp(x, HX4, eio(prog(t, WOB1, STEP1))) * (t < bWin + .25 ? 1 : 1);
  if (t >= bWin + .25) { x = heroGroundJ(t).x; y = heroGroundJ(t).y; }
  return { x, y };
}
function heroGroundJ(t) { let x = HX4, y = top(4); for (const j of JUMPS.slice(4)) { if (t >= j.t1) { x = j.x1; y = j.y1; } else if (t > j.t0) { const k = eio(prog(t, j.t0, j.t1)); x = lerp(j.x0, j.x1, k); y = lerp(j.y0, j.y1, k); } } return { x, y }; }
function heroState(t) {
  const g = heroGround(t), s = { x: g.x, y: g.y, ry: .85, expr: 'happy' };
  let air = null;
  for (const j of JUMPS) if (t > j.t0 && t < j.t1) air = j;
  const breathe = Math.sin(t * 4) * .04;
  s.aL = breathe; s.aR = -breathe;
  if (air) {
    const k = prog(t, air.t0, air.t1);
    s.x = lerp(air.x0, air.x1, k); s.y = lerp(air.y0, air.y1, k) + 4 * air.h * k * (1 - k);
    s.aL = -2.7; s.aR = -2.4; s.lL = -.7; s.lR = .5; s.sq = -.08;
  }
  for (const j of JUMPS) { const after = t - j.t1; if (after > 0 && after < .2) s.sq = .18 * Math.sin(Math.PI * after / .2); }
  // wobble on the edge
  if (t > WOB0 && t < WOB1) {
    const k = prog(t, WOB0, WOB1), amp = 1 - k;
    s.rz = Math.sin(k * 14) * .35 * amp + .1 * amp; s.aL = -t * 16; s.aR = -t * 16 + Math.PI; s.expr = 'shock';
  }
  if (t >= WOB1 && t < STEP1) { const ph = prog(t, WOB1, STEP1) * Math.PI * 2; s.lL = Math.sin(ph) * .5; s.lR = -Math.sin(ph) * .5; s.aL = -Math.sin(ph) * .4; s.aR = Math.sin(ph) * .4; }
  const tp = B.tempt.L[0], st = B.stop, bl = B.block;
  if (t >= B.stranger.L[1].a && t < tp.a) s.expr = 'happy';
  if (t >= tp.a && t < st.a) { s.expr = 'starry'; s.aL = -2.5 + Math.sin(t * 14) * .3; s.aR = -2.5 - Math.sin(t * 14) * .3; s.y += Math.abs(Math.sin((t - tp.a) * 9)) * .5 * (1 - prog(t, tp.b, tp.b + .3)); }
  if (t >= st.a && t < bl.a) s.expr = 'shock';
  if (t >= bl.a && t < bWin + .25) {
    s.expr = 'determined';
    const l0 = bl.L[0];
    if (t < l0.b + .2) s.hy = Math.sin((t - l0.a) * 18) * .45 * pulse(t, l0.a - .05, l0.d + .3);
    s.aL = -.2; s.aR = -.2;
    s.zL = .5 * prog(t, l0.b, l0.b + .3); s.zR = -.5 * prog(t, l0.b, l0.b + .3);   // hands on hips
  }
  if (t >= LAND) {
    s.expr = 'grin'; s.ry = lerp(.85, .15, eio(prog(t, LAND, LAND + .6)));
    const hop = Math.abs(Math.sin((t - LAND) * 5.2)); s.y = top(6) + hop * 1.1;
    s.zL = -2.5 - Math.sin(t * 10) * .25; s.zR = 2.5 + Math.sin(t * 10) * .25; s.aL = 0; s.aR = 0;
    s.lL = -.25 * hop; s.lR = .25 * hop;
  }
  return s;
}
// ------------------------------------------------------------------ the stranger
const BX = PL[5].x + .6;
const POP_IN = B.stranger.L[0].a + .75;
const blockLine = B.block.L[1];
const T_BLOCK = wt(blockLine, 'blocked') + .15, T_REPORT = wt(blockLine, 'reported') + .1, T_ADULT = wt(blockLine, 'grown') + .05;
const POOF = T_BLOCK + .05;
ev(POP_IN, 'poof'); ev(B.stranger.L[1].a, 'sparkle');
function badState(t) {
  const s = { x: BX, y: top(5), ry: -.8, expr: 'sly' };
  s.scale = t < POP_IN ? 0 : t < POOF ? eob(prog(t, POP_IN, POP_IN + .35)) : 1 - eio(prog(t, POOF, POOF + .25));
