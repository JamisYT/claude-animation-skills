const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eo = t => 1 - Math.pow(1 - t, 3);
const ei = t => t * t * t;
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function keys(list) {           // [[t, value or array], ...] eased between keys
  return t => {
    if (t <= list[0][0]) return list[0][1];
    for (let i = 1; i < list.length; i++) if (t <= list[i][0]) {
      const [t0, a] = list[i - 1], [t1, b] = list[i], k = eio(prog(t, t0, t1));
      return Array.isArray(a) ? a.map((v, j) => lerp(v, b[j], k)) : lerp(a, b, k);

    return list[list.length - 1][1];
  };
}

{

{

}
function cheeks(p, y, z, gap) { for (const s of [-1, 1]) { const c = mesh(new THREE.CircleGeometry(.12, 16), new THREE.MeshBasicMaterial({ color: 0xFF8FB1, transparent: true, opacity: .7 }), s * gap, y, z, p); c.rotation.y = s * .5; } }

  return out;
}
function rig(g, head, mouth, legs, tail, extra = {}) { return { g, head, mouth, legs, tail, ...extra }; }

  const head = new THREE.Group(); head.position.set(0, 1.9, 1.05); g.add(head);
  sph(.66, std(0xffffff), 0, .1, 0, head, 1, .95, .95);

  sph(.14, std(0xFFD23F, { metalness: .4, roughness: .3 }), 0, -.62, .25, head);
  const tail = new THREE.Group(); tail.position.set(0, 1.6, -1.2); g.add(tail); mesh(new THREE.CylinderGeometry(.04, .04, .8, 6), std(0xffffff), 0, -.4, -.05, tail); sph(.1, std(0x222222), 0, -.82, -.05, tail);

// ------------------------------------------------------------------ choreography
function talking(t, k) { const s = BEAT[k], d = VO[`${k}_snd`]; if (t < s.snd || t > s.sndEnd) return 0; const u = (t - s.snd) / d; return Math.max(0, Math.sin(u * Math.PI * 2 * 2)) ** .7; }

// ------------------------------------------------------------------ 2D overlay

}

const CONF = [...Array(140)].map((_, i) => ({ x: rand(i) * W, v: 300 + rand(i + 1) * 400, d: rand(i + 2) * 2, r: rand(i + 3) * 6, s: 16 + rand(i + 4) * 16, c: RAINBOW[i % 6], sw: rand(i + 5) * 3 }));

  X.beginPath(); X.arc(-326, 0, 48, 0, 7); X.fillStyle = '#FFD93D'; X.fill();
  X.fillStyle = '#3A2A10'; X.beginPath(); X.arc(-342, -8, 6, 0, 7); X.arc(-310, -8, 6, 0, 7); X.fill(); X.strokeStyle = '#3A2A10'; X.lineWidth = 5; X.lineCap = 'round'; X.beginPath(); X.arc(-326, 4, 16, .2 * Math.PI, .8 * Math.PI); X.stroke();
  X.font = '36px I7'; X.fillStyle = '#0A0C11'; X.textAlign = 'left'; X.textBaseline = 'alphabetic'; X.fillText('Subscribe for more', -258, -6);
  X.font = '24px I6'; X.fillStyle = '#6B7280'; X.fillText('new animal friends every week', -258, 30);
